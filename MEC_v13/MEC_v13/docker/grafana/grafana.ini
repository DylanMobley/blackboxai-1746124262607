#####################################
# 📊 GRAFANA CONFIGURATION - MEC_v13+
#####################################

[server]
protocol = http
http_addr = 
http_port = 3000
domain = localhost
enforce_domain = false
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

[security]
admin_user = admin
admin_password = admin
allow_embedding = true
cookie_secure = false
disable_gravatar = false
allow_loading_unsigned_plugins = true

[users]
default_theme = dark
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[auth]
disable_login_form = false

[auth.basic]
enabled = true

[auth.proxy]
enabled = false

[auth.github]
enabled = false

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[panels]
disable_sanitize_html = true

[plugins]
allow_loading_unsigned_plugins = true

[dashboard]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/mec_dashboard.json

[log]
mode = console
level = info
