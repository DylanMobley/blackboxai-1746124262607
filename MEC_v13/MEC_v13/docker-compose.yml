version: "3.9"

services:
  mec_api:
    container_name: mec_api
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn backend.api:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:${API_PORT:-5101}
    ports:
      - "${API_PORT:-5101}:${API_PORT:-5101}"
    env_file:
      - .env
    volumes:
      - ./mnt:/app/mnt
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine
    container_name: mec_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: mec_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-dbname}
      POSTGRES_USER: ${DB_USER:-username}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  pg_data:
